<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<header style="position: relative; background: transparent; transform: {{shift}}; transition: {{shiftTransition}}; font-family: 'Outfit', 'Helvetica Neue', sans-serif; color: #141414">
<div aria-hidden="true" style="position: absolute; left: 0; right: 0; top: 0; bottom: -28px; pointer-events: none; z-index: 0; background: linear-gradient(to bottom, rgba(255,255,255,0.32) 0%, rgba(255,255,255,0.12) 60%, rgba(255,255,255,0) 100%); backdrop-filter: blur(12px) saturate(1.15); -webkit-backdrop-filter: blur(12px) saturate(1.15); mask-image: linear-gradient(to bottom, #000 0%, rgba(0,0,0,0.85) 45%, transparent 100%); -webkit-mask-image: linear-gradient(to bottom, #000 0%, rgba(0,0,0,0.85) 45%, transparent 100%)"></div>
<div style="position: relative; z-index: 1; max-width: 1360px; margin: 0 auto; box-sizing: border-box; padding: 0 clamp(20px, 4vw, 48px); height: 88px; display: flex; align-items: center; justify-content: space-between; gap: 24px">
<a href="Home.dc.html" aria-label="Rivara — Home" style="display: flex; align-items: center; text-decoration: none"><img src="images/rivara-logo.png" alt="Rivara" style="display: block; height: 66px; width: auto"></a>
<sc-if value="{{desktop}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; align-items: center; gap: 48px">
<nav aria-label="Main" style="display: flex; gap: 36px">
<sc-for list="{{items}}" as="it" hint-placeholder-count="4">
<a href="{{it.href}}" style="padding: 8px 0 6px; border-bottom: 1px solid {{it.line}}; font-size: 12px; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: {{it.color}}; text-decoration: none" style-hover="color: #141414">{{it.label}}</a>
</sc-for>
</nav>
<a href="Contact.dc.html" style="padding: 13px 22px; background: #141414; color: #ffffff; font-size: 11px; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; text-decoration: none; transition: background .25s, color .25s" style-hover="background: #B59444; color: #141414">Enquire</a>
</div>
</sc-if>
<sc-if value="{{mobile}}" hint-placeholder-val="{{ false }}">
<button type="button" onClick="{{toggle}}" aria-expanded="{{open}}" aria-label="{{menuLabel}}" style="min-width: 44px; height: 44px; padding: 0 2px; border: 0; background: transparent; font: inherit; font-size: 11px; font-weight: 500; letter-spacing: 0.22em; text-transform: uppercase; color: #141414; cursor: pointer; display: flex; align-items: center; gap: 12px"><span style="display: block; min-width: 44px; text-align: right">{{menuLabel}}</span><span style="position: relative; display: block; width: 22px; height: 12px"><span style="position: absolute; left: 0; top: {{lineTop}}; display: block; width: 22px; height: 1px; background: #141414; transform: {{lineA}}; transition: transform .6s cubic-bezier(.76,0,.24,1), top .6s cubic-bezier(.76,0,.24,1)"></span><span style="position: absolute; left: 0; top: {{lineBottom}}; display: block; width: 22px; height: 1px; background: #141414; transform: {{lineB}}; transition: transform .6s cubic-bezier(.76,0,.24,1), top .6s cubic-bezier(.76,0,.24,1)"></span></span></button>
</sc-if>
</div>
<sc-if value="{{mobile}}" hint-placeholder-val="{{ false }}">
<div aria-hidden="{{menuHidden}}" style="position: fixed; inset: 0; z-index: 0; background: #ffffff; visibility: {{menuVis}}; clip-path: {{menuClip}}; transition: clip-path .9s cubic-bezier(.76,0,.24,1), visibility 0s linear {{visDelay}}; overflow-y: auto">
<div style="min-height: 100%; box-sizing: border-box; padding: 132px clamp(24px, 7vw, 56px) 40px; display: flex; flex-direction: column">
<span style="display: block; margin-bottom: 20px; font-size: 10px; font-weight: 600; letter-spacing: 0.26em; text-transform: uppercase; color: #8a8a8a; opacity: {{menuFade}}; transition: opacity .6s ease {{labelDelay}}">Menu</span>
<nav aria-label="Mobile" style="display: flex; flex-direction: column; border-top: 1px solid #ececec">
<sc-for list="{{mobileItems}}" as="it" hint-placeholder-count="4">
<a href="{{it.href}}" tabindex="{{it.tab}}" style="display: flex; align-items: baseline; gap: 18px; padding: 20px 0; border-bottom: 1px solid #ececec; text-decoration: none; color: {{it.color}}; opacity: {{it.mo}}; transform: {{it.mt}}; transition: opacity .7s ease {{it.md}}, transform 1s cubic-bezier(.16,1,.3,1) {{it.md}}">
<span style="font-family: 'Libre Baskerville', Georgia, serif; font-style: italic; font-size: 12px; color: #B59444; min-width: 20px">{{it.num}}</span>
<span style="font-size: 15px; font-weight: 400; letter-spacing: 0.22em; text-transform: uppercase">{{it.label}}</span>
</a>
</sc-for>
</nav>
<div style="margin-top: auto; padding-top: 48px; display: flex; flex-direction: column; gap: 28px; opacity: {{menuFade}}; transform: {{footShift}}; transition: opacity .7s ease {{footDelay}}, transform 1s cubic-bezier(.16,1,.3,1) {{footDelay}}">
<div style="display: flex; flex-direction: column; gap: 8px; font-size: 13px; letter-spacing: 0.02em; color: #6e6e6e">
<a href="mailto:sachin@rivaragifting.com" tabindex="{{footTab}}" style="color: #6e6e6e; text-decoration: none">sachin@rivaragifting.com</a>
<a href="tel:+919152117519" tabindex="{{footTab}}" style="color: #6e6e6e; text-decoration: none">+91 91521 17519</a>
</div>
<a href="Contact.dc.html" tabindex="{{footTab}}" style="padding: 17px 22px; background: #141414; color: #ffffff; text-align: center; font-size: 11px; font-weight: 500; letter-spacing: 0.22em; text-transform: uppercase; text-decoration: none">Enquire for Custom Gifting</a>
<p style="margin: 0; font-family: 'Libre Baskerville', Georgia, serif; font-style: italic; font-size: 13px; color: #8a8a8a">Curated in India. Crafted by Artisans.</p>
</div>
</div>
</div>
</sc-if>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:120},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;home&quot;,&quot;collections&quot;,&quot;story&quot;,&quot;contact&quot;],&quot;default&quot;:&quot;home&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { w: typeof window !== 'undefined' ? window.innerWidth : 1440, open: false, hidden: false };
  componentDidMount() {
    this._r = () => this.setState({ w: window.innerWidth });
    this._y = window.scrollY;
    this._s = () => {
      const y = window.scrollY, dy = y - this._y;
      if (Math.abs(dy) < 4) return;
      const hidden = dy > 0 && y > 120 && !this.state.open;
      if (hidden !== this.state.hidden) { this.setState({ hidden }); document.documentElement.style.setProperty('--rv-header', hidden ? '0px' : '88px'); }
      this._y = y;
    };
    window.addEventListener('resize', this._r);
    window.addEventListener('scroll', this._s, { passive: true });
  }
  componentWillUnmount() { window.removeEventListener('resize', this._r); window.removeEventListener('scroll', this._s); document.body.style.overflow = ''; }
  componentDidUpdate(pp, ps) {
    const open = this.state.open && this.state.w < 900;
    if (open !== (ps.open && ps.w < 900)) document.body.style.overflow = open ? 'hidden' : '';
  }
  renderVals() {
    const a = this.props.active ?? 'home';
    const items = [['home', 'Home', 'Home.dc.html'], ['collections', 'Collections', 'Collections.dc.html'], ['story', 'Our Story', 'OurStory.dc.html'], ['contact', 'Contact', 'Contact.dc.html']]
      .map(([k, label, href], i) => ({ label, href, num: String(i + 1).padStart(2, '0'), color: k === a ? '#141414' : '#6e6e6e', line: k === a ? '#B59444' : 'transparent' }));
    const mobile = this.state.w < 900;
    const hid = this.state.hidden;
    const o = mobile && this.state.open;
    const m = items.map((it, i) => ({ ...it, tab: o ? '0' : '-1', mo: o ? 1 : 0, mt: o ? 'none' : 'translateY(24px)', md: o ? (0.35 + i * 0.07) + 's' : '0s' }));
    return { menuHidden: o ? 'false' : 'true', menuVis: o ? 'visible' : 'hidden', visDelay: o ? '0s' : '.9s', menuClip: o ? 'inset(0 0 0 0)' : 'inset(0 0 100% 0)', menuFade: o ? 1 : 0, labelDelay: o ? '.3s' : '0s', footDelay: o ? '.65s' : '0s', footShift: o ? 'none' : 'translateY(16px)', footTab: o ? '0' : '-1',
      lineTop: o ? '6px' : '2px', lineBottom: o ? '6px' : '10px', lineA: o ? 'rotate(45deg)' : 'none', lineB: o ? 'rotate(-45deg)' : 'none', mobileItems: m, shift: hid ? 'translateY(-130%)' : 'none', shiftTransition: hid ? 'transform .35s cubic-bezier(.4,0,.2,1)' : 'transform .18s ease-out', items, desktop: !mobile, mobile, open: mobile && this.state.open, menuLabel: this.state.open ? 'Close' : 'Menu', toggle: () => this.setState(s => ({ open: !s.open })) };
  }
}
</script>
</body>
</html>
